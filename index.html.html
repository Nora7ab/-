<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كبسولة المستقبل 2027 | اليوم الوطني السعودي</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #050b07;
/* شبكة تقنية واضحة ومتحركة بسرعة أكبر */
background-image:
linear-gradient(rgba(0, 255, 100, 0.1) 2px, transparent 2px),
linear-gradient(90deg, rgba(0, 255, 100, 0.1) 2px, transparent 2px);
background-size: 50px 50px;
animation: moveGrid 6s linear infinite;
color: #fff;
margin: 0;
padding: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
overflow: hidden;
}

/* حركة أسرع للشبكة عشان تلاحظينها بوضوح */
@keyframes moveGrid {
0% {
background-position: 0 0;
}
100% {
background-position: 50px 50px;
}
}

.container {
background: rgba(5, 20, 10, 0.92);
backdrop-filter: blur(12px);
border: 1px solid rgba(0, 230, 118, 0.5);
color: #fff;
padding: 40px;
border-radius: 20px;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 230, 118, 0.2);
text-align: center;
max-width: 600px;
width: 90%;
z-index: 2;
}
h1 {
color: #00e676;
margin-bottom: 15px;
font-size: 28px;
letter-spacing: 1px;
text-shadow: 0 0 12px rgba(0, 230, 118, 0.5);
}
p {
color: #b0bec5;
line-height: 1.8;
margin-bottom: 30px;
font-size: 16px;
}
.btn {
background: linear-gradient(135deg, #00e676, #00c853);
color: #050b07;
padding: 14px 35px;
text-decoration: none;
border-radius: 30px;
font-weight: bold;
font-size: 18px;
box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
transition: all 0.3s ease;
display: inline-block;
border: 1px solid rgba(255, 255, 255, 0.3);
}
.btn:hover {
background: linear-gradient(135deg, #00c853, #009624);
color: #fff;
transform: translateY(-3px);
box-shadow: 0 8px 25px rgba(0, 230, 118, 0.7);
}
.footer {
margin-top: 25px;
font-size: 13px;
color: #78909c;
letter-spacing: 0.5px;
z-index: 2;
}
</style>
</head>
<body>

<div class="container">
<h1>كبسولة المستقبل 2027</h1>
<p>أهلاً بك في رحلة نحو المستقبل! اكتب رسالة لنفسك أو لوطنك الحبيب، عبّر فيها عن طموحاتك وأحلامك لتراها بنفسك في اليوم الوطني لعام 2027.<br><strong style="color: #00e676;">ملاحظة:</strong> لن تُفتح هذه الكبسولة إلا في عام 2027 بإذن الله.</p>

</div>
